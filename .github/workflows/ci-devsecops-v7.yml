
name: DevSecOps CI, Cognitive & ISO Compliance Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root workspace dependencies
        run: npm ci

      - name: Install React frontend dependencies
        run: npm ci --prefix task5_rest_api_react_frontend/frontend

      - name: Build React frontend
        run: npm run build --prefix task5_rest_api_react_frontend/frontend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run verification and STLC suites
        run: npm run verify:all

      - name: Run live HTTP integration tests
        run: npm run test:e2e

      - name: Run compliance scorecard
        run: npm run compliance

      - name: Run MCP server self-test
        run: python3 shared/mcp_tools_server.py --self-test

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
